services:
  - type: web
    name: pulmoscan
    runtime: python
    # Relative to the repo root (not this file). Without it Render builds at the repo root, where there is no requirements.txt.
    rootDir: projectFinal
    plan: 1c-2g # 2 GB RAM; app peaks ~500 MB, so the 512 MB plans would get OOM-killed
    region: singapore
    buildCommand: pip install -r requirements.txt
    # 1 worker: the rate limiter and SQLite live in one process. 120 s covers slow LLM replies (60 s timeout).
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /
    disk:
      name: pulmoscan-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.16
      - key: DATA_DIR
        value: /var/data
      - key: OMP_NUM_THREADS # torch/sklearn would otherwise spawn a thread per host core on a 1-CPU instance
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: OLLAMA_URL
        value: https://ollama.com/api/chat
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OLLAMA_MODEL
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
