<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulmoScan | SignUp</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='signup_style.css') }}">
</head>
<body>
    <div class="nav-bar">
        <div class="logo">🫁 PulmoScan</div>
        <div class="nav-cons">
            <div class="nav-link"><a href="{{ url_for('home') }}">Home</a></div>
            <div class="nav-link"><a href="{{ url_for('about') }}">About</a></div>
            <div class="nav-link">
                <a href="https://wa.me/8801776111134?text=Hello%20I%20want%20to%20know%20about%20your%20service" target="_blank">Contact</a>
            </div>
        </div>
        <div class="ham-img">
            <img src="{{ url_for('static', filename='images/Hamburger.svg') }}" alt="Menu">
        </div>
        <div class="mobile-menu">
            <div class="close-menu">✕</div>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('about') }}">About</a>
            <a href="https://wa.me/8801776111134?text=Hello%20I%20want%20to%20know%20about%20your%20service" target="_blank">Contact</a>
        </div>
    </div>

    <div class="main">
        <div class="outer-flash-container">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="external-flash {{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </div>

        <div class="whole">
            <div class="log-sign">
                <div class="login"><a href="{{ url_for('login') }}">LogIn</a></div>
                <div class="signup"><a href="{{ url_for('signup') }}">SignUp</a></div>
            </div>
            
            <div class="form">
                <p>Signing Up</p>
                <form action="{{ url_for('signup') }}" method="POST">
                    <div class="email">
                        <label for="email_input">Email</label>
                        <input type="email" id="email_input" name="email" placeholder="pulmoscan@gmail.com" required>
                    </div>
                    
                    <div class="pass">
                        <label for="password_input">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password_input" name="password" placeholder="Password" required>
                            <span id="togglePassword" class="toggle-icon">
                                <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                                </svg>
                                <svg id="eyeClose" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" style="display: none;">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 1-4.243-4.243m4.242 4.242L9.88 9.88" />
                                </svg>
                            </span>
                        </div>
                    </div>
                    
                    <button type="submit" class="submit-btn">Signup</button>
                </form>
            </div>
        </div>
    </div>

    <div class="footer">
        <footer>&copy; Rights reserved by PulmoScan</footer>
    </div>

    <script>
        // Hamburger Menu Controls
        const hamburger = document.querySelector(".ham-img");
        const mobileMenu = document.querySelector(".mobile-menu");
        const closeMenu = document.querySelector(".close-menu");

        hamburger.addEventListener("click", () => {
            mobileMenu.classList.add("active");
        });

        closeMenu.addEventListener("click", () => {
            mobileMenu.classList.remove("active");
        });

        // Password Visibility Logic
        const passwordInput = document.querySelector("#password_input");
        const togglePassword = document.querySelector("#togglePassword");
        const eyeOpen = document.querySelector("#eyeOpen");
        const eyeClose = document.querySelector("#eyeClose");

        togglePassword.addEventListener("click", () => {
            const isPassword = passwordInput.getAttribute("type") === "password";
            passwordInput.setAttribute("type", isPassword ? "text" : "password");

            if (isPassword) {
                eyeOpen.style.display = "none";
                eyeClose.style.display = "block";
            } else {
                eyeOpen.style.display = "block";
                eyeClose.style.display = "none";
            }
        });
    </script>
</body>
</html>
