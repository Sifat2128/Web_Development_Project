<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulmoScan | SignUp</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='signup_style.css') }}">
</head>
<body>
    <div class="nav-bar">
        <div class="logo">🫁 PulmoScan</div>
        <div class="nav-cons">
            <div class="nav-link"><a href="{{ url_for('home') }}">Home</a></div>
            <div class="nav-link"><a href="{{ url_for('about') }}">About</a></div>
            <div class="nav-link">
                <a href="https://wa.me/8801776111134?text=Hello%20I%20want%20to%20know%20about%20your%20service" target="_blank">Contact</a>
            </div>
        </div>
        <div class="ham-img">
            <img src="{{ url_for('static', filename='images/Hamburger.svg') }}" alt="Menu">
        </div>
        <div class="mobile-menu">
            <div class="close-menu">✕</div>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('about') }}">About</a>
            <a href="https://wa.me/8801776111134?text=Hello%20I%20want%20to%20know%20about%20your%20service" target="_blank">Contact</a>
        </div>
    </div>

    <div class="main">
        <div class="outer-flash-container">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="external-flash {{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </div>

        <div class="whole">
            <div class="log-sign">
                <div class="login"><a href="{{ url_for('login') }}">LogIn</a></div>
                <div class="signup"><a href="{{ url_for('signup') }}">SignUp</a></div>
            </div>
            <div class="form">
                <p>Signing Up</p>
                <form action="{{ url_for('signup') }}" method="POST">
                    <div class="email">
                        <label for="email_input">Email</label>
                        <input type="email" id="email_input" name="email" placeholder="pulmoscan@gmail.com" required>
                    </div>
                    <div class="pass">
                        <label for="password_input">Password</label>
                        <input type="password" id="password_input" name="password" placeholder="Password" required>
                    </div>
                    <button type="submit" class="submit-btn">Signup</button>
                </form>
            </div>
        </div>
    </div>

    <div class="footer">
        <footer>&copy; Rights reserved by PulmoScan</footer>
    </div>

    <script>
        const hamburger = document.querySelector(".ham-img");
        const mobileMenu = document.querySelector(".mobile-menu");
        const closeMenu = document.querySelector(".close-menu");

        hamburger.addEventListener("click", () => {
            mobileMenu.classList.add("active");
        });

        closeMenu.addEventListener("click", () => {
            mobileMenu.classList.remove("active");
        });
    </script>
</body>
</html>
