<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Info | PulmoScan</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='patient_info.css') }}">
</head>
<body>
    <div class="nav-bar">
        <div class="logo">🫁 PulmoScan</div>
        <div class="nav-cons">
            <div class="nav-link"><a href="{{ url_for('home') }}">Home</a></div>
            <div class="nav-link"><a href="{{ url_for('about') }}">About</a></div>
            <div class="nav-link"><a href="{{ url_for('logout') }}">Logout</a></div>
        </div>
        <div class="ham-img" onclick="toggleMenu()">
            <img src="{{ url_for('static', filename='images/Hamburger.svg') }}" alt="Menu">
        </div>
    </div>

    <div class="mobile-menu" id="mobileMenu">
        <div class="close-menu" onclick="toggleMenu()">✕</div>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('about') }}">About</a>
        <a href="{{ url_for('logout') }}">Logout</a>
    </div>

    <div class="main">
        <div class="outer-flash-container">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="external-flash {{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </div>

        <div class="whole">
            <div class="log-sign">
                <div class="signup">
                    <a href="#">Patient Registration</a>
                </div>
            </div>

            <div class="form">
                <p>Clinical Details</p>
                <form action="{{ url_for('patient_info') }}" method="POST">
                    <div class="input-field">
                        <label>Patient Full Name</label>
                        <input type="text" name="name" placeholder="Enter name" required>
                    </div>

                    <div class="form-row">
                        <div class="input-field">
                            <label>Age</label>
                            <input type="number" name="age" placeholder="Years" required>
                        </div>
                        <div class="input-field">
                            <label>Sex</label>
                            <select name="sex">
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="input-field">
                        <label>Phone Number</label>
                        <input type="tel" name="phone" placeholder="+880..." required>
                    </div>

                    <button type="submit" class="verify-btn">Proceed to Scan</button>
                </form>
            </div> 
        </div>
    </div>

    <div class="footer">
        <footer>&copy; Rights reserved by PulmoScan</footer>
    </div>

    <script>
        function toggleMenu() {
            document.getElementById('mobileMenu').classList.toggle('active');
        }
    </script>
</body>
</html>
